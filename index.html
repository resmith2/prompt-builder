<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Prompt Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<script src="https://cdn.tailwindcss.com/3.4.5"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Geist', 'system-ui', 'sans-serif'], mono: ['"Geist Mono"', 'ui-monospace', 'monospace'] },
        colors: {
          ink: '#0f0f0d', surface: '#171714', raised: '#1f1f1b', line: '#2c2b26',
          paper: '#ece7dc', muted: '#948e80', accent: '#d8a55c'
        }
      }
    }
  };
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="grain">
<main class="overflow-x-hidden w-full max-w-full">

  <!-- Builder -->
  <section id="builder" class="px-4 sm:px-6 pt-12 md:pt-16 pb-24 bg-[radial-gradient(ellipse_at_top,rgba(216,165,92,.06),transparent_60%)]">
    <div class="max-w-7xl mx-auto">
      <h1 class="text-[clamp(1.75rem,3vw,2.5rem)] font-semibold tracking-[-0.03em] leading-[1.05]">Skill prompt builder</h1>

      <!-- Skill picker -->
      <div class="mt-10 flex flex-wrap gap-2" role="radiogroup" aria-label="Skill" id="skill-picker"></div>

      <!-- Mode -->
      <div class="mt-8">
        <div class="inline-flex flex-wrap rounded-3xl border border-line bg-surface p-1" role="radiogroup" aria-label="What are you working on" id="mode-picker"></div>
      </div>
      <p id="mode-hint" class="mt-3 text-sm text-muted"></p>

      <div class="mt-10 grid grid-cols-1 lg:grid-cols-12 gap-10">
        <div id="forms" class="lg:col-span-7">
          <p id="no-input" class="text-sm text-muted" hidden>This step takes no input. Copy the command and run it in your agent's chat.</p>
        </div>

        <div class="lg:col-span-5">
          <div class="lg:sticky lg:top-24">
            <div class="rounded-2xl border border-line bg-surface overflow-hidden">
              <div class="flex items-center justify-between gap-3 px-4 py-3 border-b border-line">
                <label for="prompt" class="text-sm font-medium">Your prompt</label>
                <div class="flex items-center gap-3">
                  <span id="count" class="text-xs text-muted font-mono"></span>
                  <button id="copy" type="button" class="rounded-full bg-paper text-ink text-sm font-medium px-4 py-1.5 hover:bg-white transition-colors inline-flex items-center gap-1.5">
                    <i class="ph ph-copy"></i><span>Copy</span>
                  </button>
                </div>
              </div>
              <textarea id="prompt" readonly spellcheck="false" class="block w-full h-[60vh] lg:h-[calc(100vh-12rem)] resize-none bg-transparent p-5 font-mono text-[13px] leading-relaxed text-paper/90 focus:outline-none"></textarea>
            </div>
            <p class="mt-3 text-xs text-muted">Anything in angle brackets is a slot you have not filled yet.</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="px-4 sm:px-6 pb-12">
    <div class="max-w-7xl mx-auto">
      <div class="pt-8 border-t border-line flex flex-col sm:flex-row justify-between gap-4 text-sm text-muted">
        <span>skillprompt. Prompt shapes for agent skills.</span>
        <div class="flex gap-6">
          <a href="https://www.tasteskill.dev/guide?view=full" target="_blank" rel="noopener" class="hover:text-paper">Taste guide</a>
          <a href="https://github.com/Leonxlnx/taste-skill" target="_blank" rel="noopener" class="hover:text-paper">taste-skill on GitHub</a>
        </div>
      </div>
    </div>
  </footer>
</main>

<script src="js/core.js"></script>
<script src="skills/taste.js"></script>
<script src="skills/spec-kit.js"></script>
<script src="skills/coming-soon.js"></script>
<script src="js/app.js"></script>
</body>
</html>
